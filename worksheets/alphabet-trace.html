<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alphabet Tracing · Little Learners</title>
  <link rel="stylesheet" href="../style.css" />
  <link rel="icon" href="../icons/icon-192.png" />
</head>
<body>
  <div class="worksheet-page">
    <a class="back-link" href="../index.html">&larr; Back to worksheets</a>
    <div class="worksheet-sheet">
      <h1>Alphabet Tracing</h1>
      <p>Trace each letter with your finger, then say its sound out loud.</p>

      <p style="font-family: var(--font-display); font-size: 3.2rem; letter-spacing: 0.6rem; color:#5AA9E6; text-align:center;">
        A B C D E
      </p>
      <p style="font-family: var(--font-display); font-size: 3.2rem; letter-spacing: 0.6rem; color:#5AA9E6; text-align:center;">
        F G H I J
      </p>

      <button class="mark-done-btn" id="doneBtn">Mark as done</button>
    </div>
  </div>
  <script src="../app.js"></script>
  <script>setupDoneButton("alphabet-trace");</script>
</body>
</html>
